name: MIC insider conviction data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_mic_insiders.py
      - scripts/fetch_mic_insiders_xoomar.py
      - .github/workflows/mic-insider.yml
  schedule:
    - cron: '*/30 12-23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: mic-insider-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner dependencies
        run: python -m pip install --disable-pip-version-check requests yfinance
      - name: Build Insider Conviction dataset
        run: python scripts/fetch_mic_insiders_xoomar.py
      - name: Commit changed scanner data
        run: |
          if [ -z "$(git status --porcelain -- mic/data/insider/latest.json mic/data/insider/raw_events.json mic/data/insider/state.json)" ]; then
            echo "No insider scanner changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Gibiamie@users.noreply.github.com"
          git add mic/data/insider/latest.json mic/data/insider/raw_events.json mic/data/insider/state.json
          git commit -m "data: refresh MIC insider conviction scanner"
          git pull --rebase origin main
          git push
