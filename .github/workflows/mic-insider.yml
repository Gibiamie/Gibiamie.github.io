name: MIC insider conviction data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_mic_insiders.py
      - scripts/fetch_mic_insiders_v2.py
      - scripts/fetch_mic_insiders_v3.py
      - .github/workflows/mic-insider.yml
  schedule:
    - cron: '*/30 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: mic-insider-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SEC_USER_AGENT: MIC Insider Scanner/1.0 100677393+Gibiamie@users.noreply.github.com
      MIC_MAX_NEW_FORM4: '250'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 yfinance
      - name: Scan Form 4 purchases and enrich market data
        run: python scripts/fetch_mic_insiders_v3.py
      - name: Commit changed scanner data
        run: |
          if [ -z "$(git status --porcelain -- mic/data/insider)" ]; then
            echo "No insider scanner changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mic/data/insider
          git commit -m "data: refresh MIC insider conviction scanner"
          git pull --rebase origin main
          git push
