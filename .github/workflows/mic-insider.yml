name: MIC insider conviction data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_mic_insiders.py
      - scripts/fetch_mic_insiders_v2.py
      - scripts/fetch_mic_insiders_v3.py
      - scripts/probe_mic_insider_provider.py
      - .github/workflows/mic-insider.yml
  schedule:
    - cron: '*/30 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: mic-insider-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Probe keyless SEC-derived Form 4 provider
        run: python scripts/probe_mic_insider_provider.py
      - name: Commit provider probe
        run: |
          if [ -z "$(git status --porcelain -- mic/data/insider)" ]; then
            echo "No probe output"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mic/data/insider/provider_probe.json
          git commit -m "data: probe Form 4 provider schema"
          git pull --rebase origin main
          git push
