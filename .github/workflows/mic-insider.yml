name: MIC insider conviction data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe_mic_insider_dashboard.py
      - .github/workflows/mic-insider.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Inspect insider dashboard API
        run: python scripts/probe_mic_insider_dashboard.py
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Gibiamie@users.noreply.github.com"
          git add mic/data/insider/provider_dashboard_probe.json
          git commit -m "data: inspect insider dashboard provider" || exit 0
          git pull --rebase origin main
          git push
