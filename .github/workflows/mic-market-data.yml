name: Update MIC market data

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/update_mic_data.py
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: mic-market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/update_mic_data.py
      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mic/data/market.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh MIC market data"
          git push
