<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10172a" />
  <meta name="description" content="FirstStep, gerçek ortamlarda spontane ve saygılı sohbet başlangıçları sunan gizlilik odaklı mobil PWA." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest?v=0.3.6" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css?v=0.3.3" />
  <link rel="stylesheet" href="mobile-fixes-0.3.4.css?v=0.3.4" />
  <link rel="stylesheet" href="smart-venue-0.3.6.css?v=0.3.6" />
  <title>FirstStep – Social Context Assistant</title>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="app-shell">
    <header class="topbar">
      <button id="brandButton" class="brand" type="button" aria-label="FirstStep home">
        <span class="brand-mark">F</span>
        <span class="brand-copy">
          <strong>FirstStep</strong>
          <small id="brandTagline">Gerçek ortamda, doğru ilk adım.</small>
        </span>
      </button>
      <div class="topbar-actions">
        <span id="networkBadge" class="status-pill" aria-live="polite">Çevrimiçi</span>
        <button id="installButton" class="top-action hidden" type="button" aria-label="Yükle">↓</button>
        <select id="languageSelect" class="language-select" aria-label="Language">
          <option value="tr">TR</option>
          <option value="en">EN</option>
        </select>
      </div>
    </header>

    <main id="mainContent" tabindex="-1">
      <section class="boot-message" id="bootMessage">
        <strong>FirstStep Beta 0.3.6 yükleniyor…</strong>
        <p>Bu mesaj birkaç saniyeden uzun kalırsa sayfayı yenileyin.</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button id="favoritesButton" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"/></svg>
        <span id="favoritesLabel">Favoriler</span>
      </button>
      <button type="button" class="home-fab" onclick="document.getElementById('brandButton').click()" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9h-6v-6H9v6H3v-9Z"/></svg>
      </button>
      <button id="privacyButton" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.7 2.8 8.2 7 10 4.2-1.8 7-5.3 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
        <span id="privacyLabel">Gizlilik</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app-0.3.3.js?v=0.3.3"></script>
  <script src="app-0.3.5-autotype.js?v=0.3.5"></script>
  <script src="smart-venue-0.3.6.js?v=0.3.6"></script>
</body>
</html>
