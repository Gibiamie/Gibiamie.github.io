<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="FirstStep: mekânı anlayan, hızlı ve saygılı konuşma başlangıçları sunan mobil uygulama." />
  <link rel="manifest" href="manifest.webmanifest?v=1.0.0" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="v1.css?v=1.0.0" />
  <title>FirstStep</title>
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <span class="eyebrow">FIRSTSTEP</span>
        <h1>Konuşmaya doğru yerden başla.</h1>
        <p>Mekânı yaz, söyle veya konumunu kullan. Tür seçme, uzun form yok.</p>
      </div>
      <span id="net" class="net">Çevrimiçi</span>
    </header>

    <main>
      <section class="card search-card" aria-labelledby="searchTitle">
        <div class="section-head">
          <div>
            <h2 id="searchTitle">Neredesiniz?</h2>
            <p>Mekân adı, şehir veya ülke yazın. Birkaç harften sonra öneriler açılır.</p>
          </div>
        </div>

        <label class="search-box" for="q">
          <span>🔎</span>
          <input id="q" type="search" autocomplete="off" inputmode="search" placeholder="Örn. Tradervicks Muscat, White Rock Beach Denpasar" />
        </label>

        <div class="quick-row">
          <button id="voiceBtn" class="ghost" type="button">🎙️ Söyle</button>
          <button id="locBtn" class="primary" type="button">📍 Konumumu kullan</button>
        </div>

        <div id="status" class="status hidden" role="status"></div>
        <div id="results" class="results hidden" role="listbox" aria-label="Mekân ve konum önerileri"></div>
      </section>

      <section id="selectedCard" class="card selected hidden" aria-live="polite"></section>

      <section id="intentCard" class="card hidden">
        <h2>Şu anda neye ihtiyacınız var?</h2>
        <div id="intentChips" class="chips"></div>
      </section>

      <section id="answerCard" class="card answer-card hidden" aria-live="polite"></section>
    </main>
  </div>

  <nav class="bottom-tabs" aria-label="Hızlı menü">
    <button id="tabHome" type="button">⌂<span>Başlat</span></button>
    <button id="tabRescue" type="button">⚡<span>Kurtarma</span></button>
    <button id="tabPrivacy" type="button">🔒<span>Gizlilik</span></button>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <script src="v1.js?v=1.0.0"></script>
</body>
</html>
